<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">

    <h:head>
        <title>Edit Recipe - Admin</title>
        <h:outputStylesheet name="css/dashboard.css"/>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </h:head>

    <h:body>
        <f:metadata>
            <f:event type="preRenderView" listener="#{loginBean.redirectIfNotAdmin}" />
        </f:metadata>

<ui:include src="/admin/admin_sidebar.xhtml">
    <ui:param name="activePage" value="updateRecipe" />
</ui:include>
        <div class="main-content">
            <h1>Edit Recipe</h1>

            <h:form enctype="multipart/form-data" styleClass="form-card">
                <h:messages infoClass="msg-success" errorClass="msg-error"/>

                <div class="form-group">
                    <label>Title</label>
                    <h:inputText value="#{recipeBean.title}" styleClass="form-input"/>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <h:inputTextarea value="#{recipeBean.description}" rows="3" styleClass="form-input"/>
                </div>

                <div class="form-group">
                    <label>Steps</label>
                    <h:inputTextarea value="#{recipeBean.steps}" rows="6" styleClass="form-input"/>
                </div>

                <div class="form-group">
                    <label class="form-label">Category</label>

                    <h:selectOneMenu value="#{recipeBean.categoryId}" 
                                     converter="categoryConverter"
                                     styleClass="form-input select-input">

                        <f:selectItem itemLabel="Select Category" itemValue="#{null}" />

                        <f:selectItems value="#{recipeBean.categoryList}"
                                       var="c"
                                       itemValue="#{c}"
                                       itemLabel="#{c.categoryName}" />
                    </h:selectOneMenu>
                </div>

                <div class="form-group">
                    <label>Difficulty</label>
                    <h:selectOneMenu value="#{recipeBean.difficulty}" styleClass="form-input">
                        <f:selectItem itemLabel="Easy" itemValue="EASY"/>
                        <f:selectItem itemLabel="Medium" itemValue="MEDIUM"/>
                        <f:selectItem itemLabel="Hard" itemValue="HARD"/>
                    </h:selectOneMenu>
                </div>

                <div class="form-group">
                    <label>Change Image (optional)</label>
                    <h:inputFile value="#{recipeBean.imageFile}" styleClass="form-input"/>
                </div>

                <div class="form-group">
                    <label>Video URL</label>
                    <h:inputText value="#{recipeBean.videoUrl}" styleClass="form-input"/>
                </div>

                <div class="btn-container">
                    <h:commandButton value="Update Recipe"
                                     action="#{recipeBean.updateRecipe}"
                                     styleClass="btn-primary"/>
                </div>

            </h:form>
        </div>

    </h:body>
</html>
