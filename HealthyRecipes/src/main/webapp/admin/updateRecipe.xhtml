<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>Edit Recipe - Admin</title>
        <h:outputStylesheet name="css/dashboard.css"/>
    </h:head>

    <h:body>

        <div class="sidebar">
            <h:form>
                <h:link outcome="/home" styleClass="brand">Healthy Recipes</h:link>
            </h:form>

            <nav class="menu">
                <ul>
                    <li><h:link outcome="/admin/adminDashboard" styleClass="nav-link ">Admin Dashboard</h:link></li>
                    <li><h:link outcome="/admin/addRecipe" styleClass="nav-link">Add Recipe</h:link></li>
                    <li><h:link outcome="/admin/manageUsers" styleClass="nav-link">User Management</h:link></li>
                    <li><h:link outcome="/admin/adminActivity" styleClass="nav-link">📌 My Activity</h:link></li>
                    <li><h:link outcome="/admin/allActivity" styleClass="nav-link">All Activity</h:link></li>
                    <li><h:link outcome="/admin/profile" styleClass="nav-link">Profile</h:link></li>
                </ul>
            </nav>

            <div class="logout-container">
               <h:form>
                    <h:commandLink value="Logout"
                                   action="#{loginBean.logout}"
                                   onclick="return confirm('Are you sure?');"
                                   styleClass="logout-btn"/>
                </h:form>
            </div>
        </div>

        <div class="main-content">
            <h1>Edit Recipe</h1>

            <h:form enctype="multipart/form-data" styleClass="form-card">
                <h:messages infoClass="msg-success" errorClass="msg-error"/>

                <div class="form-group">
                    <label>Title</label>
                    <h:inputText value="#{recipeBean.title}" styleClass="form-input"/>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <h:inputTextarea value="#{recipeBean.description}" rows="3" styleClass="form-input"/>
                </div>

                <div class="form-group">
                    <label>Steps</label>
                    <h:inputTextarea value="#{recipeBean.steps}" rows="6" styleClass="form-input"/>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <h:selectOneMenu value="#{recipeBean.category}" styleClass="form-input">
                        <f:selectItem itemLabel="Veg" itemValue="Veg"/>
                        <f:selectItem itemLabel="Non-Veg" itemValue="Non-Veg"/>
                        <f:selectItem itemLabel="Breakfast" itemValue="Breakfast"/>
                        <f:selectItem itemLabel="Soup" itemValue="Soup"/>
                        <f:selectItem itemLabel="Sweets" itemValue="Sweets"/>
                    </h:selectOneMenu>
                </div>

                <div class="form-group">
                    <label>Difficulty</label>
                    <h:selectOneMenu value="#{recipeBean.difficulty}" styleClass="form-input">
                        <f:selectItem itemLabel="Easy" itemValue="EASY"/>
                        <f:selectItem itemLabel="Medium" itemValue="MEDIUM"/>
                        <f:selectItem itemLabel="Hard" itemValue="HARD"/>
                    </h:selectOneMenu>
                </div>

                <div class="form-group">
                    <label>Change Image (optional)</label>
                    <h:inputFile value="#{recipeBean.imageFile}" styleClass="form-input"/>
                </div>

                <div class="form-group">
                    <label>Video URL</label>
                    <h:inputText value="#{recipeBean.videoUrl}" styleClass="form-input"/>
                </div>

                <div class="btn-container">
                    <h:commandButton value="Update Recipe"
                                     action="#{recipeBean.updateRecipe}"
                                     styleClass="btn-primary"/>
                </div>

            </h:form>
        </div>

    </h:body>
</html>
