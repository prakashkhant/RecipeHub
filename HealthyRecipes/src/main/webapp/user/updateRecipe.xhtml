<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough">

    <h:head>
        <title>Edit Recipe</title>
        <h:outputStylesheet name="css/dashboard.css"/>
    </h:head>

    <h:body>
        <f:metadata>
            <f:event type="preRenderView" listener="#{loginBean.redirectIfNotLoggedIn}" />
        </f:metadata>

        <div class="sidebar">
            <h:link outcome="/home" styleClass="brand">Healthy Recipe</h:link>

            <nav class="menu">
                <ul>
                    <li><h:link outcome="/user/userDashboard" styleClass="nav-link">Dashboard</h:link></li>
                    <li><h:link outcome="/user/addRecipe" styleClass="nav-link active">Add Recipe</h:link></li>
                    <li><h:link outcome="/user/profile" styleClass="nav-link">Profile</h:link></li>
                    <li><h:link outcome="/user/likedRecipes" styleClass="nav-link ">Liked Recipes</h:link></li>
                    <li><h:link outcome="/user/activity" styleClass="nav-link">📌 My Activity</h:link></li>

                </ul>
            </nav>

            <div class="logout-container">
                <h:form>
                    <h:commandLink value="Logout" action="#{loginBean.logout}" class="logout-btn"/>
                </h:form>
            </div>
        </div>

        <div class="main-content">

            <h1>Edit Recipe</h1>

            <h:form enctype="multipart/form-data" styleClass="form-card">
                <h:messages infoClass="msg-success" errorClass="msg-error" layout="list"/>

                <div class="form-group">
                    <label>Title</label>
                    <h:inputText value="#{recipeBean.title}" styleClass="form-input"/>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <h:inputTextarea value="#{recipeBean.description}" rows="3" styleClass="form-input"/>
                </div>

                <div class="form-group">
                    <label>Steps</label>
                    <h:inputTextarea value="#{recipeBean.steps}" rows="6" styleClass="form-input"/>
                </div>

                <div class="form-group">
                    <label class="form-label">Category</label>

                    <h:selectOneMenu value="#{recipeBean.categoryId}" 
                                     converter="categoryConverter"
                                     styleClass="form-input select-input">

                        <f:selectItem itemLabel="Select Category" itemValue="#{null}" />

                        <f:selectItems value="#{recipeBean.categoryList}"
                                       var="c"
                                       itemValue="#{c}"
                                       itemLabel="#{c.categoryName}" />
                    </h:selectOneMenu>
                </div>


                <div class="form-group">
                    <label>Difficulty</label>
                    <h:selectOneMenu value="#{recipeBean.difficulty}" styleClass="form-input">
                        <f:selectItem itemLabel="Easy" itemValue="EASY"/>
                        <f:selectItem itemLabel="Medium" itemValue="MEDIUM"/>
                        <f:selectItem itemLabel="Hard" itemValue="HARD"/>
                    </h:selectOneMenu>
                </div>

                <div class="form-group">
                    <label>Change Image (optional)</label>
                    <h:inputFile value="#{recipeBean.imageFile}" styleClass="form-input"/>
                </div>

                <div class="form-group">
                    <label>Video URL</label>
                    <h:inputText value="#{recipeBean.videoUrl}" styleClass="form-input"/>
                </div>

                <div class="btn-container">
                    <h:commandButton value="Update Recipe"
                                     action="#{recipeBean.updateRecipe}"
                                     styleClass="btn-primary"/>
                </div>

            </h:form>
        </div>

    </h:body>
</html>
