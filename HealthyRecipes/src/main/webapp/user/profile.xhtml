<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:pt="jakarta.faces.passthrough"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <title>Profile - Healthy Recipes</title>
    <h:outputStylesheet name="css/dashboard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</h:head>

<h:body>
<f:metadata>
    <f:event type="preRenderView" listener="#{loginBean.redirectIfNotLoggedIn}" />
</f:metadata>

<ui:include src="/user/user_sidebar.xhtml">
    <ui:param name="activePage" value="profile" />
</ui:include>

<div class="main-content">

    <h1>Profile</h1>

    <h:form styleClass="form-card">
        <h:messages layout="list" infoClass="msg-success" errorClass="msg-error" />

        <div class="form-group">
            <label>Username</label>
            <h:inputText value="#{profileBean.currentUser.userName}" styleClass="form-input" disabled="true" />
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <h:inputText value="#{profileBean.currentUser.fullName}" styleClass="form-input"/>
        </div>

        <div class="form-group">
            <label>Email</label>
            <h:inputText value="#{profileBean.currentUser.email}" styleClass="form-input"/>
        </div>

       <div class="form-group">
    <label>New Password</label>
    <h:inputSecret value="#{profileBean.newPassword}" styleClass="form-input"
                   pt:placeholder="Leave blank if no change" />
</div>

<div class="form-group">
    <label>Confirm Password</label>
    <h:inputSecret value="#{profileBean.confirmPassword}" styleClass="form-input"
                   pt:placeholder="Re-enter new password" />
</div>


        <div class="btn-container">
            <h:commandButton value="Update Profile"
                             action="#{profileBean.updateProfile}"
                             styleClass="btn-primary" />
        </div>

    </h:form>

</div>

</h:body>
</html>
