<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>User Activity</title>
        <h:outputStylesheet name="css/dashboard.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </h:head>

    <h:body>
<f:metadata>
    <f:event type="preRenderView" listener="#{loginBean.redirectIfNotLoggedIn}" />
</f:metadata>

        <!-- Sidebar Include -->
   <ui:include src="/user/user_sidebar.xhtml">
    <ui:param name="activePage" value="myActivity" />
</ui:include>

        <div class="main-content">
            <h2>📌 My Activity</h2>

            <!-- Comments Table -->
            <div class="table-box">
                <h3>📝 My Comments</h3>
                <h:form id="commentsTable">
                    <table class="dashboard-table">
                        <thead>
                            <tr>
                                <th>Recipe</th>
                                <th>Comment</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody>
                            <ui:repeat value="#{userDashboardBean.userComments}" var="c">
                                <tr>
                                    <td>
                                        <h:graphicImage library="img" 
                                                        name="#{c.recipeId.imageUrl}"
                                                        style="width:60px; border-radius:6px;"/>
                                        <br/>#{c.recipeId.title}
                                    </td>
                                    <td>#{c.text}</td>
                                    <td>#{c.createdAt}</td>
                                    <td>
                                     

                                        <h:commandButton value="Delete"
                                                         action="#{userDashboardBean.deleteComment(c.commentId)}"
                                                         onclick="return confirm('Delete this comment?');"
                                                         styleClass="btn-danger">
                                            <f:ajax render="commentsTable"/>
                                        </h:commandButton>
                                    </td>
                                </tr>
                            </ui:repeat>
                        </tbody>
                    </table>
                </h:form>
            </div>


            <!-- Liked Recipes Table -->
            <div class="table-box">
                <h3>❤️ Liked Recipes</h3>

                <h:form>
                    <table class="dashboard-table">
                        <h:panelGroup rendered="#{empty userDashboardBean.likedRecipes}">
                            <div class="no-data-msg">
                                No Recipes Liked Yet! ❤️<br />
                                Go like some delicious recipes!
                            </div>
                        </h:panelGroup>

                        <thead>
                            <tr>
                                <th>Recipe</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody>
                            <ui:repeat value="#{userDashboardBean.likedRecipes}" var="r">
                                <tr>
                                    <td>
                                        <h:graphicImage library="img" 
                                                        name="#{r.imageUrl}"
                                                        style="width:60px; border-radius:6px;"/>
                                        <br/>#{r.title}
                                    </td>
                                    <td>
                                        <h:commandButton 
                                            action="#{recipeBean.removeLike(r.recipeId)}"
                                            value="💔 Remove"
                                            onclick="return confirm('Are you sure you want to remove this recipe from liked list?');"

                                            styleClass="remove-like-btn">
                                            <f:ajax render="@all" />
                                        </h:commandButton>
                                    </td>
                                </tr>
                            </ui:repeat>
                        </tbody>
                    </table>
                </h:form>
            </div>

        </div>
        <!-- Popup for Editing Comment -->
       

    </h:body>
</html>
