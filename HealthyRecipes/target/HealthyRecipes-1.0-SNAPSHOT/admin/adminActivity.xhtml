<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>Admin Activity</title>
        <h:outputStylesheet name="css/dashboard.css" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </h:head>

    <h:body>
        <f:metadata>
            <f:event type="preRenderView" listener="#{loginBean.redirectIfNotAdmin}" />
        </f:metadata>

        <!-- Sidebar -->
       <ui:include src="/admin/admin_sidebar.xhtml">
    <ui:param name="activePage" value="myActivity" />
</ui:include>

        <div class="main-content">
            <h2>📌 My Activity (Admin)</h2>

            <!-- Admin Created Recipes -->
            <div class="table-box">
                <h3>📍 Recipes Created by Me</h3>

                <h:form id="adminRecipesForm">
                    <table class="dashboard-table">
                        <thead>
                            <tr><th>Image</th><th>Title</th><th>Category</th><th>Action</th></tr>
                        </thead>
                        <tbody>
                            <ui:repeat value="#{adminActivityBean.adminRecipes}" var="r">
                                <tr>
                                    <td><h:graphicImage library="img" name="#{r.imageUrl}" style="width:60px;" /></td>
                                    <td>#{r.title}</td>
                                    <td>#{r.categoryId.categoryName}</td>
                                    <td>
                                        <h:commandLink value="✏ Edit"
                                                       action="#{recipeBean.adminEditRecipe(r.recipeId)}" 
                                                       styleClass="btn-edit btn-action"
                                                       />
                                        |
                                        <h:commandButton value="Delete"
                                                         action="#{adminDashboardBean.deleteRecipe(r.recipeId)}"
                                                         styleClass="btn-delete btn-action"
                                                         onclick="return confirm('Delete?');"/>
                                    </td>
                                </tr>
                            </ui:repeat>
                        </tbody>
                    </table>
                </h:form>
            </div>

            <!-- Liked Recipes -->
            <div class="table-box">
                <h3>❤️ Liked Recipes</h3>

                <h:form id="likesForm">
                    <table class="dashboard-table">
                        <thead><tr><th>Image</th><th>Title</th><th>Action</th></tr></thead>
                        <tbody>
                            <ui:repeat value="#{adminActivityBean.adminLikedRecipes}" var="r">
                                <tr>
                                    <td><h:graphicImage library="img" name="#{r.imageUrl}" style="width:60px;" /></td>
                                    <td>#{r.title}</td>
                                    <td>
                                        <h:commandButton value="💔 Remove"
                                                         action="#{adminActivityBean.removeLike(r.recipeId)}"
                                                         styleClass="remove-like-btn btn-action"
                                                         onclick="return confirm('Remove?');"/>
                                    </td>
                                </tr>
                            </ui:repeat>
                        </tbody>
                    </table>
                </h:form>
            </div>

            <!-- Comments -->
            <div class="table-box">
                <h3>📝 My Comments</h3>

                <h:form id="commentsForm">
                    <table class="dashboard-table">
                        <thead><tr><th>Recipe</th><th>Comment</th><th>Date</th><th>Action</th></tr></thead>
                        <tbody>
                            <ui:repeat value="#{adminActivityBean.adminComments}" var="c">
                                <tr>
                                    <td>
                                        <h:graphicImage library="img" 
                                                        name="#{c.recipeId.imageUrl}"
                                                        style="width:60px; border-radius:6px;"/>
                                        <br/>#{c.recipeId.title}        
                                    </td>
                                    <td>#{c.text}</td>
                                    <td>#{c.createdAt}</td>
                                    <td>
                                        <h:commandButton value="Delete"
                                                         action="#{adminActivityBean.deleteComment(c.commentId)}"
                                                         styleClass="btn-delete btn-action"
                                                         onclick="return confirm('Delete Comment?');" />
                                    </td>
                                </tr>
                            </ui:repeat>
                        </tbody>
                    </table>
                </h:form>
            </div>

        </div>

    </h:body>
</html>
