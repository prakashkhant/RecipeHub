<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Access Denied</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f8f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .denied-box {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.08);
            text-align: center;
            width: 350px;
        }

        .denied-box h1 {
            font-size: 24px;
            color: #c62828;
            margin-bottom: 10px;
        }

        .denied-box p {
            font-size: 14px;
            color: #555;
        }

        .back-btn {
            margin-top: 20px;
            padding: 10px 18px;
            background: #1e3f3e;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: #163130;
        }
    </style>
</h:head>

<h:body>

    <div class="denied-box">
        <h1>Access Denied</h1>
        <p>You are not authorized to view this page.</p>

        <!-- BACK BUTTON -->
  
        <a href="javascript:history.back()" class="back-btn">Go Back</a>

    </div>

</h:body>
</html>
