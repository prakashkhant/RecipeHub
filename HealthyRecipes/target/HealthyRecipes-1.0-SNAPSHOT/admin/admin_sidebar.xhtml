
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets">

    <div class="sidebar">

        <h:form>
            <h:link outcome="/home" styleClass="brand">Healthy Recipes</h:link>
        </h:form>

        <nav class="menu">
            <ul>
                <li>
                    <h:link outcome="/admin/adminDashboard"
                            styleClass="#{activePage eq 'dashboard' ? 'nav-link active' : 'nav-link'}">
                        <i class="fa-solid fa-chart-line"></i> Admin Dashboard
                    </h:link>
                </li>

                <li>
                    <h:link outcome="/admin/addRecipe"
                            styleClass="#{activePage eq 'addRecipe' ? 'nav-link active' : 'nav-link'}">
                        <i class="fa-solid fa-pen-to-square"></i> Add Recipe
                    </h:link>
                </li>

                <li>
                    <h:link outcome="/admin/manageUsers"
                            styleClass="#{activePage eq 'manageUsers' ? 'nav-link active' : 'nav-link'}">
                        <i class="fa-solid fa-users"></i> User Management
                    </h:link>
                </li>

                <li>
                    <h:link outcome="/admin/manageCategories"
                            styleClass="#{activePage eq 'categories' ? 'nav-link active' : 'nav-link'}">
                        <i class="fa-solid fa-list"></i> Manage Categories
                    </h:link>
                </li>
                <li>
                    <h:link outcome="/admin/updateRecipe"
                            styleClass="#{activePage eq 'updateRecipe' ? 'nav-link active' : 'nav-link'}">
                        <i class="fa-solid fa-file-pen"></i> Update Recipe
                    </h:link>
                </li>
                <li>
                    <h:link outcome="/admin/adminActivity"
                            styleClass="#{activePage eq 'myActivity' ? 'nav-link active' : 'nav-link'}">
                        <i class="fa-solid fa-clock-rotate-left"></i> My Activity
                    </h:link>
                </li>

                <li rendered="#{loginBean.loggedUser.userName eq 'admin'}">
                    <h:link outcome="/admin/allActivity"
                            styleClass="#{activePage eq 'allActivity' ? 'nav-link active' : 'nav-link'}">
                        <i class="fa-solid fa-database"></i> All Activity
                    </h:link>
                </li>


                <li>
                    <h:link outcome="/admin/profile"
                            styleClass="#{activePage eq 'profile' ? 'nav-link active' : 'nav-link'}">
                        <i class="fa-solid fa-user"></i> Profile
                    </h:link>
                </li>
            </ul>
        </nav>

        <div class="logout-container">
            <h:form>
                <h:commandLink action="#{loginBean.logout}"
                               onclick="return confirm('Are you sure?');"
                               styleClass="logout-btn">

                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </h:commandLink>
            </h:form>
        </div>

    </div>

</ui:composition>
