<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            background: url('bg.jpg') center/cover no-repeat;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial;
        }
        .box{
            width:380px;
            background: rgba(0, 0, 0, 0.459);
            padding:30px;
            border-radius:20px;
            box-shadow:0 8px 18px rgba(0,0,0,0.2);
        }
        .title{
            text-align:center;
            font-size:26px;
            color: #fff;
            font-weight:bold;
            margin-bottom:20px;
        }
        .form-control{
            border-radius:12px;
            padding:10px;
        }
        .btn-custom{
            width:100%;
            padding:12px;
            border-radius:12px;
            background:#ffd153;
            color:#fff;
            border:none;
            font-size:16px;
        }
        .btn-custom:hover{
            background:#f7be1f;
        }
        .switch{
            margin-top:15px;
            text-align:center;
            cursor:pointer;
            color:#f7be1f;
        }
    </style>
</head>
<body>

<a href="index.html" style="position:absolute; top:20px; left:30px; font-size:28px; font-weight:bold; color:#fff; text-decoration:none;">RecipeHub</a>

<div class="box" id="loginBox">
    <div class="title">Login</div>
    <input type="text" id="login_user" class="form-control mb-3" placeholder="Enter Username">
    <input type="password" id="login_pass" class="form-control mb-3" placeholder="Enter Password">
    <button class="btn-custom" onclick="loginUser()">Login</button>
    <div class="switch" onclick="showRegister()">Don't have an account? Register</div>
</div>

<div class="box d-none" id="registerBox">
    <div class="title">Register</div>
    <input type="text" id="reg_fullname" class="form-control mb-3" placeholder="Enter Full Name">
    <input type="text" id="reg_user" class="form-control mb-3" placeholder="Enter Username">
    <input type="email" id="reg_email" class="form-control mb-3" placeholder="Enter Email">
    <input type="password" id="reg_pass" class="form-control mb-3" placeholder="Enter Password">
    <select id="reg_role" class="form-control mb-3">
        <option value="user">User</option>
        <option value="admin">Admin</option>
    </select>
    <button class="btn-custom" onclick="registerUser()">Register</button>
    <div class="switch" onclick="showLogin()">Already have an account? Login</div>
</div>

<script>
function showRegister(){
    document.getElementById('loginBox').classList.add('d-none');
    document.getElementById('registerBox').classList.remove('d-none');
}
function showLogin(){
    document.getElementById('registerBox').classList.add('d-none');
    document.getElementById('loginBox').classList.remove('d-none');
}
function registerUser(){
    let role = document.getElementById('reg_role').value;
    if(role === 'admin'){
        window.location.href = 'admin_dashboard.html';
    } else {
        window.location.href = 'user_dashboard.html';
    }
}

function loginUser(){
    let user = document.getElementById('login_user').value;

    if(user.toLowerCase() === 'admin'){
        window.location.href = 'admin_dashboard.html';
    } else {
        window.location.href = 'user_dashboard.html';
    }
}

</script>

</body>
</html>
