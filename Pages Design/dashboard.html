<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeHub Dashboard (Static Demo)</title>
    <!-- Load Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Load Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* Custom styles to match the provided dashboard image */
        :root {
            --bs-primary: #7c3aed; /* Violet 600 */
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fc;
            min-height: 100vh;
            display: flex; /* Ensure full height on body */
        }
        .app-container {
            display: flex;
            width: 100%;
        }
        .sidebar {
            width: 250px;
            min-width: 250px;
            background-color: #fff;
            border-right: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            height: 100vh;
            padding: 1.5rem 1rem;
            flex-shrink: 0;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            cursor: pointer;
            font-weight: 500;
            color: #4b5563;
            border-radius: 0.5rem;
            transition: all 0.15s ease-in-out;
            margin-bottom: 0.25rem;
        }
        .sidebar-item:hover {
            background-color: #e5e7eb;
        }
        .sidebar-item.active {
            background-color: #ede9fe;
            color: var(--bs-primary);
            font-weight: 600;
        }
        .sidebar-item i {
            width: 1.25rem;
            margin-right: 0.75rem;
            color: #6b7280;
        }
        .sidebar-item.active i {
            color: var(--bs-primary);
        }
        .stat-card {
            border: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            transition: transform 0.15s;
            border-radius: 0.75rem !important; /* Higher radius for better match */
        }
        .stat-card:hover {
            transform: translateY(-2px);
        }
        .placeholder-box {
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #d1d5db;
            color: #6c757d;
            background-color: #f9fafb;
            border-radius: 0.5rem;
        }
        .main-content-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .app-header {
            z-index: 1020;
            position: sticky;
            top: 0;
            background-color: #fff;
            border-bottom: 1px solid #e5e7eb;
            box-shadow: 0 1px 3px rgba(0,0,0,.05);
        }
        .search-input {
            border-radius: 20px !important;
            padding-left: 1.5rem;
        }
        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }
        
        /* Mobile menu toggle button for Bootstrap */
        @media (max-width: 767.98px) {
            .sidebar {
                position: fixed;
                left: -250px;
                transition: all 0.3s;
                z-index: 1030;
                box-shadow: 0 0 10px rgba(0,0,0,0.1);
            }
            .sidebar.show {
                left: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Optional: Load Inter font globally -->
    <script>
        document.head.insertAdjacentHTML('beforeend', '<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">');
    </script>
    <div class="app-container">

        <!-- 1. Sidebar -->
        <aside id="sidebar" class="sidebar d-flex flex-column">
            <div class="d-flex align-items-center p-3 mb-4">
                <svg class="text-primary me-2" style="width: 1.5rem; height: 1.5rem;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c1.657 0 3 1.343 3 3v2l-1.42 1.42a1 1 0 01-.707.293H11.12a1 1 0 01-.707-.293L9 13v-2c0-1.657 1.343-3 3-3z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 21a9 9 0 100-18 9 9 0 000 18z"/>
                </svg>
                <span class="fs-5 fw-bold text-dark">Healthy Recipe</span>
            </div>

            <nav class="flex-grow-1">
                <p class="text-uppercase text-muted fw-semibold px-3 pb-2 mb-1 small">MAIN</p>
                <div id="nav-dashboard" class="sidebar-item active" onclick="navigate('dashboard')">
                    <i class="fa-solid fa-gauge-high"></i>
                    Dashboard
                </div>

                <p class="text-uppercase text-muted fw-semibold px-3 pt-4 pb-2 mb-1 small">APPLICATIONS</p>
                <div id="nav-recipes" class="sidebar-item" onclick="navigate('recipes')">
                    <i class="fa-solid fa-book-open"></i>
                    Recipe Management
                </div>
                <div id="nav-users" class="sidebar-item" onclick="navigate('users')">
                    <i class="fa-solid fa-users"></i>
                    User Management
                </div>
            </nav>

            <!-- Logout -->
            <div id="nav-logout" class="sidebar-item text-danger mt-auto" onclick="navigate('logout')">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </div>
        </aside>

        <!-- 2. Main Content Area -->
        <div class="main-content-wrapper">

            <!-- 2.1. Header / Navbar -->
            <header class="app-header p-3">
                <div class="container-fluid d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <button class="btn btn-sm d-md-none me-3" type="button" onclick="toggleSidebar()">
                            <i class="fa-solid fa-bars"></i>
                        </button>
                        <h1 class="fs-5 fw-semibold text-dark me-3 d-none d-sm-block">Good Morning, <span id="user-name">Jason</span>!</h1>
                        <span class="text-secondary small">/ Dashboard</span>
                    </div>

                    <div class="d-flex align-items-center">
                        

                        <div id="user-avatar" class="rounded-circle bg-primary-subtle text-primary fw-bold d-flex align-items-center justify-content-center me-2" style="width: 40px; height: 40px; cursor: pointer;">
                            JD
                        </div>
                        <span class="d-none d-lg-block small fw-medium text-dark">Hello, Jason Doe</span>
                    </div>
                </div>
            </header>

            <!-- 2.2. Main Content View -->
            <main id="main-content" class="p-4 p-md-5 flex-grow-1">
                <!-- Content will be injected here by JavaScript -->
            </main>
        </div>
    </div>

    <!-- Load Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script>
        // Static content for each view
        const dashboardView = `
            <h2 class="h3 fw-bold text-dark mb-4 mb-md-5">Dashboard Overview</h2>

            <!-- Stats Cards -->
            <div class="row g-4 mb-5">
                <!-- Total Recipes Card -->
                <div class="col-6 col-lg-3">
                    <div class="card stat-card p-4">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <h3 class="text-uppercase text-muted small fw-medium">Total Recipes</h3>
                            <i class="fa-solid fa-book-open fs-5 text-primary"></i>
                        </div>
                        <p class="display-6 fw-extrabold text-dark mb-1">4</p>
                        <p class="small mt-1 mb-0">
                            <span class="text-success fw-semibold">+12%</span>
                            <span class="text-muted ms-1">last month</span>
                        </p>
                    </div>
                </div>

                <!-- Registered Users Card -->
                <div class="col-6 col-lg-3">
                    <div class="card stat-card p-4">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <h3 class="text-uppercase text-muted small fw-medium">Registered Users</h3>
                            <i class="fa-solid fa-users fs-5 text-success"></i>
                        </div>
                        <p class="display-6 fw-extrabold text-dark mb-1">3</p>
                        <p class="small mt-1 mb-0">
                            <span class="text-danger fw-semibold">-3%</span>
                            <span class="text-muted ms-1">since last week</span>
                        </p>
                    </div>
                </div>

                <!-- Avg Prep Time Card -->
                <div class="col-6 col-lg-3">
                    <div class="card stat-card p-4">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <h3 class="text-uppercase text-muted small fw-medium">Avg Prep Time</h3>
                            <i class="fa-regular fa-clock fs-5 text-warning"></i>
                        </div>
                        <p class="display-6 fw-extrabold text-dark mb-1">28 min</p>
                        <p class="small mt-1 mb-0 text-muted">Stable</p>
                    </div>
                </div>

                <!-- New Recipes Card -->
                <div class="col-6 col-lg-3">
                    <div class="card stat-card p-4">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <h3 class="text-uppercase text-muted small fw-medium">New Recipes (7D)</h3>
                            <i class="fa-solid fa-plus-circle fs-5 text-danger"></i>
                        </div>
                        <p class="display-6 fw-extrabold text-dark mb-1">4</p>
                        <p class="small mt-1 mb-0">
                            <span class="text-success fw-semibold">+50%</span>
                            <span class="text-muted ms-1">week-over-week</span>
                        </p>
                    </div>
                </div>
            </div>

            <!-- Charts Placeholders -->
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="card p-4 shadow-sm h-100">
                        <h3 class="h5 fw-semibold text-dark mb-4">Total Recipe Views Over Time</h3>
                        <div class="placeholder-box">
                            <i class="fa-solid fa-chart-line me-2"></i> Placeholder Line Chart
                        </div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="card p-4 shadow-sm h-100">
                        <h3 class="h5 fw-semibold text-dark mb-4">Recipes by Category</h3>
                        <div class="placeholder-box">
                            <i class="fa-solid fa-chart-pie me-2"></i> Placeholder Pie Chart
                        </div>
                    </div>
                </div>
            </div>
        `;

        const recipesView = `
            <h2 class="h3 fw-bold text-dark mb-4 mb-md-5">Recipe Management (Static)</h2>
            <div class="card p-4 shadow-sm mb-4">
                <h3 class="h5 fw-semibold text-dark mb-3">Add New Recipe</h3>
                <form class="row g-3">
                    <div class="col-md-4">
                        <input type="text" placeholder="Recipe Name" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" placeholder="Prep Time (e.g., 30 min)" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <select class="form-select bg-white" required>
                            <option value="" disabled selected>Select Category</option>
                            <option value="Dinner">Dinner</option>
                            <option value="Breakfast">Breakfast</option>
                            <option value="Dessert">Dessert</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary fw-bold w-100">Save Recipe</button>
                    </div>
                </form>
            </div>

            <div class="card p-4 shadow-sm">
                <h3 class="h5 fw-semibold text-dark mb-3">Current Recipes (Demo List)</h3>
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Name</th>
                                <th scope="col">Prep Time</th>
                                <th scope="col">Category</th>
                                <th scope="col">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <th scope="row">1</th>
                                <td>Spicy Tacos</td>
                                <td>25 min</td>
                                <td>Dinner</td>
                                <td>
                                    <button class="btn btn-sm btn-info me-2"><i class="fa-solid fa-edit"></i></button>
                                    <button class="btn btn-sm btn-danger"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                            <tr>
                                <th scope="row">2</th>
                                <td>French Toast</td>
                                <td>15 min</td>
                                <td>Breakfast</td>
                                <td>
                                    <button class="btn btn-sm btn-info me-2"><i class="fa-solid fa-edit"></i></button>
                                    <button class="btn btn-sm btn-danger"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                            <tr>
                                <th scope="row">3</th>
                                <td>Chocolate Chip Cookies</td>
                                <td>45 min</td>
                                <td>Dessert</td>
                                <td>
                                    <button class="btn btn-sm btn-info me-2"><i class="fa-solid fa-edit"></i></button>
                                    <button class="btn btn-sm btn-danger"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        `;

        const usersView = `
            <h2 class="h3 fw-bold text-dark mb-4 mb-md-5">User Management (Static)</h2>
            <div class="card p-4 shadow-sm">
                <h3 class="h5 fw-semibold text-dark mb-3">Registered Users (Demo List)</h3>
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th scope="col">User ID</th>
                                <th scope="col">Name</th>
                                <th scope="col">Role</th>
                                <th scope="col">Status</th>
                                <th scope="col">Last Login</th>
                                <th scope="col">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>USER-001</td>
                                <td>Jason Doe</td>
                                <td>Admin</td>
                                <td><span class="badge bg-success">Active</span></td>
                                <td>2024-11-18</td>
                                <td>
                                    <button class="btn btn-sm btn-warning me-2"><i class="fa-solid fa-ban"></i> Block</button>
                                    <button class="btn btn-sm btn-danger"><i class="fa-solid fa-user-minus"></i> Delete</button>
                                </td>
                            </tr>
                            <tr>
                                <td>USER-002</td>
                                <td>Jane Smith</td>
                                <td>Editor</td>
                                <td><span class="badge bg-warning text-dark">Pending</span></td>
                                <td>2024-11-15</td>
                                <td>
                                    <button class="btn btn-sm btn-warning me-2"><i class="fa-solid fa-ban"></i> Block</button>
                                    <button class="btn btn-sm btn-danger"><i class="fa-solid fa-user-minus"></i> Delete</button>
                                </td>
                            </tr>
                            <tr>
                                <td>USER-003</td>
                                <td>Alex Johnson</td>
                                <td>User</td>
                                <td><span class="badge bg-secondary">Inactive</span></td>
                                <td>2024-10-01</td>
                                <td>
                                    <button class="btn btn-sm btn-warning me-2"><i class="fa-solid fa-ban"></i> Block</button>
                                    <button class="btn btn-sm btn-danger"><i class="fa-solid fa-user-minus"></i> Delete</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        `;

        const logoutView = `
            <div class="text-center p-5 card shadow-sm">
                <i class="fa-solid fa-sign-out-alt fa-3x text-danger mb-4"></i>
                <h2 class="h3 fw-bold mb-3">Logged Out Successfully</h2>
                <p class="text-muted">This is a static demonstration. In a real application, you would be redirected to the login page.</p>
                <button class="btn btn-primary mt-3" onclick="navigate('dashboard')">Go to Dashboard Demo</button>
            </div>
        `;

        const contentMap = {
            'dashboard': dashboardView,
            'recipes': recipesView,
            'users': usersView,
            'logout': logoutView
        };

        const mainContent = document.getElementById('main-content');
        const sidebar = document.getElementById('sidebar');

        // Function to handle navigation and content rendering
        window.navigate = (view) => {
            // Update active sidebar item
            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.classList.remove('active');
            });
            const navItem = document.getElementById('nav-' + view);
            if (navItem) {
                navItem.classList.add('active');
            }

            // Render content
            mainContent.innerHTML = contentMap[view] || dashboardView;

            // Hide sidebar on mobile after navigation
            if (window.innerWidth < 768) {
                sidebar.classList.remove('show');
            }
        };

        // Function to toggle sidebar visibility on mobile
        window.toggleSidebar = () => {
            sidebar.classList.toggle('show');
        };

        // Load the dashboard view on initial page load
        document.addEventListener('DOMContentLoaded', () => {
            navigate('dashboard');
        });
    </script>
</body>
</html>
